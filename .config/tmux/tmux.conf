source-file ~/.config/tmux/keybindings.conf
source-file ~/.config/tmux/theme.conf

# Habilitar soporte para mouse
set -g mouse on

# Aumentar el historial de scroll
set -g history-limit 100000

# Iniciar ventanas y paneles en el directorio actual
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"


# Renumerar ventanas automáticamente al cerrar una
set -g renumber-windows on

# Mantener sincronizados el portapapeles del sistema y tmux (si está soportado)
set -s set-clipboard on

# colores 256
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
